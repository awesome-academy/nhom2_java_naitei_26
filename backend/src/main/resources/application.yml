spring:
  application:
    name: sun-booking-tours
  profiles:
    include: secret
  datasource:
    url: jdbc:postgresql://localhost:5432/sun_booking_tours
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import: "optional:classpath:application-secret.yml"

server:
  port: 8080

app:
  jwt:
    expiration-ms: 86400000
